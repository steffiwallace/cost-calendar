<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CostTracker (test)</title>
<meta name="description" content="CostTracker test build: a calendar that knows what your plans cost">
<meta name="theme-color" content="#F5F3FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CostTracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.amt-in:focus,.amt-in:focus-visible{outline:none;border-bottom-color:var(--acc,#7C3AED)!important}
.amt-in::placeholder{color:#B8BEC8}
input,select,textarea{min-width:0;max-width:100%}
[style*="grid-template-columns"]>div{min-width:0}
input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;line-height:normal;text-align:left}
input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{text-align:left;margin:0}
button:focus-visible,input:focus-visible{outline:2px solid #7C3AED;outline-offset:2px}
.num{font-family:'Bricolage Grotesque',Inter,sans-serif;font-variant-numeric:tabular-nums}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;margin:0;border-radius:16px;background:#B8BEC8;position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(17,19,24,.25);transition:transform .2s}
.sw:checked{background:var(--acc,#7C3AED)}
.sw:checked::after{transform:translateX(20px)}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
::placeholder{color:#6B7180;opacity:1}
@keyframes popA{0%{transform:scale(1)}35%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes popB{0%{transform:scale(1)}35%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes ringA{0%{box-shadow:0 0 0 0 rgba(255,208,0,.95)}100%{box-shadow:0 0 0 16px rgba(255,208,0,0)}}
@keyframes ringB{0%{box-shadow:0 0 0 0 rgba(255,208,0,.95)}100%{box-shadow:0 0 0 16px rgba(255,208,0,0)}}
@keyframes slideRA{from{transform:translateX(28px);opacity:.15}to{transform:none;opacity:1}}
@keyframes slideRB{from{transform:translateX(28px);opacity:.15}to{transform:none;opacity:1}}
@keyframes slideLA{from{transform:translateX(-28px);opacity:.15}to{transform:none;opacity:1}}
@keyframes slideLB{from{transform:translateX(-28px);opacity:.15}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes calHeadIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes stripIn{from{opacity:0;clip-path:inset(0 0 0 0 round 14px);transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes flowIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes calExpandIn{from{opacity:.4;clip-path:inset(0 0 80% 0 round 22px)}to{opacity:1;clip-path:inset(0 0 0 0 round 22px)}}
@keyframes shakeA{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes shakeB{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#F5F3FA;overscroll-behavior:none}
body{box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{height:100%}
#crash{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99;padding:12px 14px;border-radius:12px;background:#881337;color:#fff;font:600 14px/1.4 system-ui,sans-serif}
@media (min-width:700px){body{background:#E6E2EF}}
</style>
</head>
<body>
<div id="app"></div>
<div id="crash" role="alert" hidden></div>
<noscript>CostTracker needs JavaScript turned on.</noscript>
<script src="app.js?v=26ba6d2f"></script>
</body>
</html>
