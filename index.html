<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cost Calendar</title>
<meta name="description" content="Calendar and cost tracker">
<meta name="theme-color" content="#f8fafc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cost Calendar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:#0f172a}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #4f46e5;outline-offset:2px}
@keyframes csUp{from{transform:translateY(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes csFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cs-full{animation:csUp .32s cubic-bezier(.2,.8,.2,1)}
.cs-toast{animation:csFade .25s ease-out}
@keyframes csDim{from{background:rgba(15,23,42,0)}}
.cs-fade{animation:csDim .3s ease-out}
.cs-full{will-change:transform}
.cs-outer{scrollbar-gutter:stable;overflow-x:hidden}
.cs-switch{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;margin:0;border-radius:16px;background:#cbd5e1;position:relative;cursor:pointer;transition:background .2s}
.cs-switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(15,23,42,.25);transition:transform .2s}
.cs-switch:checked{background:#4f46e5}
.cs-switch:checked::after{transform:translateX(20px)}
.cs-fdark{--ink:#fff;--ink2:rgba(255,255,255,.85);--ink-acc:#fff;--track:rgba(255,255,255,.25);--chip:rgba(255,255,255,.14);--sep:rgba(255,255,255,.22);--alert:#fff;color:#fff}
.cs-flight{--ink:#0f172a;--ink2:#1e293b;--ink-acc:#0f172a;--track:rgba(15,23,42,.16);--chip:rgba(255,255,255,.45);--sep:rgba(15,23,42,.12);--alert:#881337;color:#0f172a}
.cs-selrow{position:relative;cursor:pointer}
.cs-selrow>select{position:absolute;inset:0;width:100%!important;height:100%!important;box-sizing:border-box;padding:0 40px 0 110px!important;z-index:1;border-radius:inherit}
.cs-selrow>label,.cs-selrow>svg{position:relative;z-index:2;pointer-events:none}
.cs-selrow>svg{margin-left:auto}
.cs-selrow:hover{background:#f8fafc}
.cs-selrow>select:focus,.cs-selrow>select:focus-visible{outline:none}
.cs-selrow:focus-within{background:#eef2ff}
.cs-selrow:focus-within>label{color:#3730a3}
.cs-costin::placeholder{color:#0f172a;font-weight:600;opacity:1}
.cs-costin:focus::placeholder{color:#64748b;font-weight:400}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:transparent;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.cs-scrolling::-webkit-scrollbar-thumb{background-color:rgba(15,23,42,.24)}
::-webkit-scrollbar-thumb:hover,::-webkit-scrollbar-thumb:active{background-color:rgba(15,23,42,.38)}
#agenda::-webkit-scrollbar-track{margin-top:var(--sb-top,0px)}
::-webkit-scrollbar-button{display:none;height:0;width:0}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:transparent transparent}.cs-scrolling{scrollbar-color:rgba(15,23,42,.25) transparent}}
</style>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#fff;overscroll-behavior:none}
body{box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{height:100%;background:#f8fafc}
#crash{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99;padding:12px 14px;border-radius:12px;background:#881337;color:#fff;font:600 14px/1.4 system-ui,sans-serif}
@media (min-width:700px){body{background:#e2e8f0}#app{background:transparent}}
</style>
</head>
<body>
<div id="app"></div>
<div id="crash" role="alert" hidden></div>
<noscript>Cost Calendar needs JavaScript turned on.</noscript>
<script src="app.js?v=4729c878"></script>
</body>
</html>
